<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMT Fleet Maintenance</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="#dashboard"><img src="bmt-logo.jpg" alt="Brisbane Machinery Transport"><span>Fleet Maintenance<small id="company-name">Brisbane Machinery Transport</small></span></a>
  <nav id="nav" hidden>
    <a href="#dashboard" data-v="dashboard">Dashboard</a>
    <a href="#trucks" data-v="trucks">Fleet</a>
    <a href="#km" data-v="km">Daily km</a>
    <a href="#settings" data-v="settings">Settings</a>
  </nav>
  <span class="sp"></span>
  <button class="btn primary" id="log-btn" data-act="log-service" hidden>+ Log service</button>
</div></header>
<main class="wrap" id="app"><div class="banner">Loading…</div></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>

<script>
  // If a file didn't upload, say so instead of showing "Loading…" forever.
  setTimeout(function () {
    if (!window.Store || !window.KmParse || typeof render !== "function") {
      var m = document.getElementById("app");
      if (m) m.innerHTML = '<div class="banner warn"><b>Some files are missing.</b> Check that all of these are uploaded to GitHub, next to index.html: app.js, store.js, km-parse.js, config.js, styles.css, bmt-logo.jpg.</div>';
    }
  }, 6000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="km-parse.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
